<style>

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1118; --surface:#131a24; --surface2:#18212d; --ink:#e4e9f1; --muted:#8f9bad; --line:#253042;
  --main:#6e97ff; --look:#ff7563; --net:#a986ff; --pcie:#33c2b5; --stall:#56627a;
  --delayed:#e2a63b; --eager:#58c26b; --diloco:#a9b4c6; --ddp:#7d889c; color-scheme:dark}}
:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}

.s-eager{stroke:var(--eager);fill:var(--eager)} .s-delayed{stroke:var(--delayed);fill:var(--delayed)} .s-ddp{stroke:var(--ddp);fill:var(--ddp)}

.yes{color:var(--eager)} .noo{color:var(--look)} .q{color:var(--muted)}
.notes{display:grid;gap:12px;counter-reset:n}
.note{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 10px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.note::before{counter-increment:n;content:counter(n);font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}
.note h4{margin:0 0 3px;font-size:14.5px;font-weight:600}
.note p{margin:0;font-size:14px;color:var(--ink)}
.note .src{font-size:12px;color:var(--muted);margin-top:4px}
.tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:2px}
footer{margin-top:48px;}
.tld{position:relative;display:inline-block}.tld::after{content:"\02DC";position:absolute;left:0;right:0;top:.02em;text-align:center;font-size:.9em;line-height:1}

@media (prefers-reduced-motion: reduce){.f2 g.grp{transition:none}.f2 .flow path{animation:none}}
</style>

<body>
<header class="wrap">
  <div class="eyebrow">ICLR 2027 submission 22409 · interactive reading</div>
  <h1>LACCO, two models on <span class="t">one</span> clock<span class="tt">.</span></h1>
</header>

<main class="wrap">

<!-- ============ 1. dataflow ============ -->
<section id="idea">
  <h2>The Mechanism</h2>
  <p>Figure 2, run from t = 0 as in Algorithm 1 (θ<sub>0</sub> = θ̃<sub>0</sub>, g̃<sub>0</sub> = 0), with K = 4 replicas.</p>
  <div class="panel">
    <div class="svgwrap"><svg class="f2" id="f2" viewBox="0 0 970 318" role="img" aria-label="Figure 2 of the paper, animated from t = 0: four LACCO stages on K = 4 replicas, outer stream above inner stream"></svg></div>
    <div class="phasebar" style="margin-top:10px">
      <button id="f2Prev" aria-label="Previous stage">◀</button>
      <button class="stg" data-s="0">Lookahead 0</button><button class="stg" data-s="1">Main 0</button><button class="stg" data-s="2">Lookahead 1</button><button class="stg" data-s="3">Main 1</button>
      <button id="f2Next" aria-label="Next stage">▶</button>
      <button id="f2Play">Pause</button>
    </div>
    <div class="readout" id="f2Stat" style="min-height:1.6em;margin-top:10px"></div>
    
  </div>
  </section>

<!-- ============ 2. timeline ============ -->
<section id="timeline">
  <h2>Four Schedules, One Clock</h2>
  <div class="panel" style="display:flex;flex-direction:column;gap:14px">
    <div class="controls">
      <div class="ctl"><label for="preset">Scenario</label>
        <select id="preset">
          <option value="paper">Paper: H100, 10 GB/s network</option>
          <option value="wan">Cross-region WAN: 1 GB/s, 40 ms</option>
          <option value="inet">Internet-grade: 100 MB/s, 80 ms</option>
          <option value="custom">Custom</option>
        </select></div>
      <div class="ctl"><label for="pSel">Model size P</label>
        <select id="pSel"><option value="134e6">134M (paper)</option><option value="325e6">325M (paper)</option><option value="500e6">500M (paper)</option><option value="1.3e9">1.3B</option><option value="7e9">7B</option><option value="70e9">70B</option></select></div>
      <div class="ctl"><label for="kSel">Replicas K <span class="hint">global batch fixed</span></label>
        <select id="kSel"><option>2</option><option selected>4</option><option>8</option><option>16</option></select></div>
      <div class="ctl"><label for="hR">Inner steps H <output id="hO"></output></label><input type="range" id="hR" min="1" max="100" step="1" value="30"></div>
      <div class="ctl"><label for="bnR">Network bandwidth <output id="bnO"></output></label><input type="range" id="bnR" min="-1.3" max="2" step="0.001" value="1"></div>
      <div class="ctl"><label for="latR">All-reduce latency <output id="latO"></output></label><input type="range" id="latR" min="0" max="300" step="1" value="0"></div>
      <div class="ctl"><label for="mfuR">MFU <output id="mfuO"></output></label><input type="range" id="mfuR" min="0.15" max="0.75" step="0.01" value="0.5"></div>
      
      <div class="ctl"><label>Lanes</label>
        <div style="display:flex;flex-wrap:wrap;gap:4px 12px">
          <label class="chk"><input type="checkbox" class="laneChk" value="diloco" checked>DiLoCo</label>
          <label class="chk"><input type="checkbox" class="laneChk" value="eager" checked>Eager</label>
          <label class="chk"><input type="checkbox" class="laneChk" value="delayed" checked>Delayed</label>
          <label class="chk"><input type="checkbox" class="laneChk" value="lacco" checked>LACCO</label>

    </div>
    <div class="formula" id="formula"></div>
    <div class="toolbar">
      <button id="tlPlay">Pause</button>
      <select id="tlSpeed" aria-label="Playback speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1× real time</option><option value="2">2×</option><option value="4">4×</option></select>
      <input class="grow" type="range" id="tlScrub" min="0" max="1000" value="0" aria-label="Scrub playhead">
      <span class="mono" id="tlTime" style="min-width:7em;text-align:right"></span>
    </div>
    <canvas id="tl" aria-label="Timeline of compute, outer step and network activity for each method"></canvas>
    <div class="readout" id="readout"></div>
  </div>
  <div class="cards" id="cards"></div>
</section>


</main>

<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const SUBS='₀₁₂₃₄₅₆₇₈₉', sub=n=>String(n).replace(/\d/g,d=>SUBS[d]);
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

function tildes(root){if(!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const list=[];while(w.nextNode()){const n=w.currentNode;if(n.nodeValue.indexOf('\u0303')>=0&&!n.parentElement.closest('svg,script,style,title,option,select'))list.push(n);}
  for(const n of list){const f=document.createDocumentFragment();for(const part of n.nodeValue.split(/(.\u0303)/)){if(part.length===2&&part[1]==='\u0303'){const sp=document.createElement('span');sp.className='tld';sp.textContent=part[0];f.appendChild(sp);}else if(part)f.appendChild(document.createTextNode(part));}n.replaceWith(f);}}
/* ---------- theme colors ---------- */
const C={};
function readColors(){const cs=getComputedStyle(document.documentElement);
  for(const k of ['bg','surface','surface2','ink','muted','line','main','look','net','pcie','stall','delayed','eager','diloco','ddp']) C[k]=cs.getPropertyValue('--'+k).trim();}
function rgba(hex,a){hex=hex.replace('#','');if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');
  const n=parseInt(hex,16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
function rgb(hex){hex=hex.replace('#','');const n=parseInt(hex,16);return[n>>16&255,n>>8&255,n&255];}
readColors();

const FM='"IBM Plex Mono", ui-monospace, monospace', FS='"IBM Plex Sans", system-ui, sans-serif', FD='"Bricolage Grotesque", "IBM Plex Sans", sans-serif';
const METH={diloco:{name:'DiLoCo',col:'diloco'},eager:{name:'Eager DiLoCo',col:'eager'},delayed:{name:'Delayed DiLoCo',col:'delayed'},lacco:{name:'LACCO',col:'look'}};
const ORDER=['diloco','eager','delayed','lacco'];

function fmtT(s){if(!isFinite(s))return '—';if(s<1)return (s*1000).toFixed(s<0.01?1:0)+' ms';if(s<120)return s.toFixed(2)+' s';if(s<7200)return (s/60).toFixed(1)+' min';if(s<172800)return (s/3600).toFixed(1)+' h';return (s/86400).toFixed(1)+' d';}
function fmtBW(b){return b>=1e9?(b/1e9).toFixed(b>=1e10?0:2).replace(/\.00$/,'')+' GB/s':(b/1e6).toFixed(0)+' MB/s';}
function fmtGB(b){return b>=1e9?(b/1e9).toFixed(b>=1e11?0:2)+' GB':(b/1e6).toFixed(0)+' MB';}

/* ---------- settings & timing model (Appendix D) ---------- */
const S={P:134e6,K:4,H:30,Ntok:131072,Fpeak:1e15,mfu:0.5,bnet:10e9,lat:0};
const PRESETS={
  paper:{bnet:10e9,lat:0,mfu:.5},
  wan:{bnet:1e9,lat:.04,mfu:.5},
  inet:{bnet:1e8,lat:.08,mfu:.5}};
function timing(s){
  const Tstep=6*s.P*s.Ntok/(s.K*s.mfu*s.Fpeak), bytes=4*s.P;
  const Tcomm=s.lat+2*(s.K-1)/s.K*bytes/s.bnet, Tinner=s.H*Tstep;
  // all state on the GPU; optimizer kernel time neglected as in Appendix D, so T_outer ~ 0
  const round={diloco:Tinner+Tcomm,eager:Math.max(Tinner,Tcomm),delayed:Math.max(Tinner,Tcomm),lacco:Math.max(Tinner,Tcomm)};
  const hc=Math.max(1,Math.ceil(Tcomm/Tstep-1e-9)),hide={delayed:hc,lacco:hc};
  return {Tstep,Tinner,Tcomm,Odil:0,round,hide,bytes};
}

/* ---------- event generation ---------- */
// rows: 0 GPU inner, 1 GPU outer, 2 network
function outerPath(ev,a,T,seq,label,mom){ev.push({row:1,t0:a,t1:a,kind:'kernel',seq,label,mom});return a;}
function gen(m,T,W){
  const ev=[],Sx=T.Tinner,Cm=T.Tcomm,H=S.H;
  if(m==='diloco'){let t=0,k=0;while(t<W&&k<400){const e=t+Sx;
    ev.push({row:0,t0:t,t1:e,kind:'compute',seq:'main',label:`θ${sub(k)} · ${H} inner steps`,k});
    ev.push({row:2,t0:e,t1:e+Cm,kind:'comm',seq:'main',label:`all-reduce g${sub(k)}`});
    const a=outerPath(ev,e+Cm,T,'main',`θ${sub(k+1)} = Nesterov(θ${sub(k)}, g${sub(k)})`,'mom');
    ev.push({row:0,t0:e,t1:a,kind:'stall',label:'idle · all-reduce, then outer step'});t=a;k++;}}
  else if(m==='eager'){let t=0,k=0,prevEnd=0;while(t<W&&k<400){const e=t+Sx;
    ev.push({row:0,t0:t,t1:e,kind:'compute',seq:'main',label:`θⁱ${sub(k)} · ${H} inner steps`,k});
    ev.push({row:2,t0:e,t1:e+Cm,kind:'comm',seq:'main',label:`all-reduce g${sub(k)}`});
    if(k===0)t=e;else{const r=Math.max(e,prevEnd);if(r>e)ev.push({row:0,t0:e,t1:r,kind:'stall',label:`wait for g${sub(k-1)}`});
      const a=outerPath(ev,r,T,'main',`θⁱ${sub(k+1)} = Nesterov(θⁱ${sub(k)}, mix(gⁱ${sub(k)}, g${sub(k-1)}))`,'mom');
      ev.push({row:0,t0:r,t1:a,kind:'stall',label:'idle · outer step needs own gⁱ (local sync)'});t=a;}
    prevEnd=e+Cm;k++;}}
  else if(m==='lacco'){let t=0,k=0,prevReady=0;
    while(t<W&&k<400){const it=k>>1,seq=k%2?'look':'main',start=t;
      const lab=k%2?`Main ${it} · from θ̃${sub(it+1)}`:`Lookahead ${it} · from θ${sub(it)}`;
      ev.push({row:0,t0:start,t1:start+Sx,kind:'compute',seq,k,h0:0,label:lab});const e=start+Sx;
      const b=Math.max(e,prevReady);
      if(b>e+1e-9)ev.push({row:0,t0:e,t1:b,kind:'stall',k,label:'wait · previous outer step'});
      ev.push({row:2,t0:b,t1:b+Cm,kind:'comm',seq,k,label:k%2?`all-reduce g̃${sub(it+1)}`:`all-reduce g${sub(it)}`});
      ev.push({row:1,t0:b+Cm,t1:b+Cm,kind:'kernel',seq,k,label:k%2?`θ̃${sub(it+2)} = OuterOpt_L(θ${sub(it+1)}, g̃${sub(it+1)})`:`θ${sub(it+1)} = OuterOpt_M(θ${sub(it)}, ½(g${sub(it)}+g̃${sub(it)}))`});
      prevReady=b+Cm;t=b;k++;}}
  else{const L=false,O=T.Odil,ends=[],starts=[];let t=0,k=0;

    s+=f2box(`f2-g-${c}`,cx,oy,gw,oh,oc)+f2sym(cx+gw/2-(C2.init?12:0),oyc+4.5,C2.og,null,C2.ogs,14);
    if(C2.init)s+=`<text x="${cx+gw/2+4}" y="${oyc+4.5}" style="font-size:13px">= 0</text>`;
    s+=`<rect id="f2-gb-${c}" x="${cx+3}" y="${oy+oh-6}" width="0" height="3.5" rx="1.5" style="fill:var(--net)"/>`;
    s+=`<line x1="${cx+gw}" x2="${cx+Wc-bw-1}" y1="${oyc}" y2="${oyc}" stroke-width="1.4" style="stroke:var(--${oc})" marker-end="url(#f2a-${oc})"/>`;
    s+=f2box(`f2-a-${c}`,cx+Wc-bw,oy,bw,oh,oc)+f2sym(cx+Wc-bw/2,oyc+4.5,C2.oa,null,C2.oas,14);
    s+=`<rect id="f2-ab-${c}" x="${cx+Wc-bw+3}" y="${oy+oh-6}" width="0" height="3.5" rx="1.5" style="fill:var(--${oc})"/>`;
    s+=`<text class="stg-s" x="${cx+Wc-bw/2}" y="${oy+oh+16}" text-anchor="middle">OuterOpt<tspan dy="3" style="font-size:8px">${C2.oopt}</tspan></text>`;
    if(c===3)s+=`<text x="${cx+Wc+20}" y="${oyc+4}" text-anchor="middle" style="fill:var(--muted)">⋯</text>`;
    s+=`</g>`;}
  $('#f2').innerHTML=s;}
let tau2=reduceMotion?1.5:0,f2Playing=!reduceMotion,f2Hold=0,f2CapI=-1,f2StatS='';
const f2el=id=>document.getElementById(id);
const f2nw=h=>h.replace(/(.\u0303ⁱ?<sub>[^<]*<\/sub>)/g,'<span class="nw">$1</span>');
function f2op(id,v){const e=f2el(id);if(e)e.style.opacity=v;}
function f2flow(id,on){const e=f2el(id);if(e)e.classList.toggle('flow',on);}
function f2Update(){const {Wc,bw,gw,x0,P}=F2,c=Math.min(3,Math.floor(tau2)),fr=tau2>=4?1:tau2-c,L=Wc-2*bw-5;
  for(let k=0;k<4;k++){const C2=F2C[k],ic=C2.inn,oc=ic==='look'?'main':'look',cx=x0+k*P,st=k<c?2:k===c?1:0;
    f2op(`f2-icol-${k}`,st===0?.28:st===1?1:.72);f2op(`f2-ocol-${k}`,st===0?.28:st===1?1:.72);
    const p=st===2?1:st===1?fr:0;
    for(let i=0;i<4;i++){f2el(`f2-pr-${k}-${i}`).setAttribute('stroke-dasharray',`${(L*p).toFixed(1)} 200`);
      const d=f2el(`f2-dot-${k}-${i}`);d.style.display=st===1&&p<1?'':'none';d.setAttribute('cx',(cx+bw+L*p).toFixed(1));
      f2el(`f2-s-${k}-${i}`).style.fill=f2fill(ic,st>=1?28:12);f2el(`f2-e-${k}-${i}`).style.fill=f2fill(ic,p>=1?28:12);}
    // g̃0 = 0 is known at start: no all-reduce, and θ̃1 = θ0 is ready at once
    const ar=C2.init?0:st===2?1:st===1?clamp((fr-F2AR0)/(F2AR1-F2AR0),0,1):0,oo=C2.init?(st>=1?1:0):st===2?1:st===1?clamp((fr-F2AR1)/(F2OP1-F2AR1),0,1):0;
    f2el(`f2-gb-${k}`).setAttribute('width',((gw-6)*ar).toFixed(1));f2el(`f2-ab-${k}`).setAttribute('width',((bw-6)*oo).toFixed(1));
    f2el(`f2-g-${k}`).style.fill=f2fill(oc,(C2.init?st>=1:ar>=1)?28:12);f2el(`f2-a-${k}`).style.fill=f2fill(oc,oo>=1?34:12);
    if(k>=1){const on=k===c&&fr<F2AR1;f2op(`f2-fi-${k}`,k>c?.14:on?1:.5);f2flow(`f2-fi-${k}`,on);}
    if(k<=2){const ready=k<c||(k===c&&(C2.init||fr>=F2OP1)),pulse=c===k+1&&fr<.12;f2op(`f2-fo-${k}`,!ready?.14:pulse?1:.5);f2flow(`f2-fo-${k}`,pulse);}}
  const lead=c===0&&fr<.12;f2op('f2-lead',lead?1:.5);f2flow('f2-lead',lead);
  const use0=c===1&&fr>=F2AR1&&fr<F2OP1;f2op('f2-h-0',use0?1:tau2<1+F2OP1?.6:.3);f2flow('f2-h-0',use0);
  const use2=c===3&&fr>=F2AR1&&fr<F2OP1;f2op('f2-h-2',use2?1:tau2>=2+F2AR1&&tau2<3+F2OP1?.7:tau2>=3+F2OP1?.3:.14);f2flow('f2-h-2',use2);
  $$('.stg').forEach(b=>b.classList.toggle('on',+b.dataset.s===c));
  const C2=F2C[c],H=S.H,h=fr>=1?H:Math.min(H,Math.floor(fr*H)+1),oo=C2.inn==='look'?'M':'L';
  const outer=C2.init?`g̃<sub>0</sub> = 0, θ̃<sub>1</sub> = θ<sub>0</sub>, nothing to send`:fr<F2AR0?`launch ${C2.gH}`:fr<F2AR1?`all-reduce ${C2.gH} ${Math.round(clamp((fr-F2AR0)/(F2AR1-F2AR0),0,1)*100)}%`:fr<F2OP1?`OuterOpt<sub>${oo}</sub> → ${C2.aH}`:`${C2.aH} ready`;
  const stat=`<div><b>${C2.stage}</b> · inner: step <b>${h}/${H}</b> · outer: <b>${outer}</b></div>`;
  if(stat!==f2StatS){f2StatS=stat;$('#f2Stat').innerHTML=f2nw(stat);tildes($('#f2Stat'));}}
function f2Tick(dt){if(f2Playing){if(tau2>=4){f2Hold+=dt;if(f2Hold>1.4){f2Hold=0;tau2=0;}}else tau2=Math.min(4,tau2+dt/F2T);}f2Update();}
function f2Go(c){tau2=clamp(c,0,3);f2Hold=0;}
$$('.stg').forEach(b=>b.addEventListener('click',()=>f2Go(+b.dataset.s)));
$('#f2Prev').addEventListener('click',()=>{const c=Math.min(3,Math.floor(tau2));f2Go(tau2-c>.15?c:c-1);});
$('#f2Next').addEventListener('click',()=>f2Go(Math.min(3,Math.floor(tau2))+1));
$('#f2Play').addEventListener('click',()=>{f2Playing=!f2Playing;$('#f2Play').textContent=f2Playing?'Pause':'Play';});
$('#f2Play').textContent=f2Playing?'Pause':'Play';
buildF2();f2Update();

/* ---------- main loop ---------- */
let last=performance.now(),roAcc=0;
function frame(now){const dt=clamp((now-last)/1000,0,.1);last=now;
  if(tlPlaying&&!drag){tau+=dt*tlSpeed;if(tau>=W)tau=0;}
  f2Tick(dt);$('#tlScrub').value=Math.round(tau/W*1000);drawTL();roAcc+=dt;if(roAcc>.1){updateReadout();roAcc=0;}
  requestAnimationFrame(frame);}
function refitAll(){readColors();fitTL();}
new ResizeObserver(()=>{refitAll();}).observe(document.body);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',refitAll);
new MutationObserver(refitAll).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
tildes(document.querySelector('header'));tildes(document.querySelector('main'));syncUI();rebuild();updateReadout();
if(reduceMotion){tau=W*0.4;}
requestAnimationFrame(frame);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(refitAll);
})();
</script>
</body>
